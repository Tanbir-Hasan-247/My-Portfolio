{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top scrolled">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">YN.</a>
            <div class="ms-auto">
                <ul class="navbar-nav flex-row">
                    <li class="nav-item me-3"><a class="nav-link" href="{% url 'home' %}#projects">Projects</a></li>
                    <li class="nav-item me-3"><a class="nav-link" href="{% url 'home' %}#experience">Experience</a></li>
                    <li class="nav-item me-3"><a class="nav-link" href="{% url 'blog_list' %}">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4">
        <p class="text-secondary">&copy; {% now "Y" %} Your Name. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
