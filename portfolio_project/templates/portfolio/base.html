{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanbir Hasan | Programmer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .fa-tech-logos i {
            font-size: 40px;
            color: var(--secondary-text);
            transition: all 0.3s ease;
        }

        .fa-tech-logos i:hover {
            color: var(--primary-text);
            transform: scale(1.1);
        }

        #about img {
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .about-stat {
            text-align: center;
            padding: 1rem;
        }

        .about-stat h3 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-text);
        }

        .about-stat p {
            color: var(--secondary-text);
            font-size: 0.9rem;
        }

        /* --- STYLES FOR NEW CODING PROFILES SECTION --- */
        .profile-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            height: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .profile-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-text);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--secondary-text);
            text-transform: uppercase;
        }

        /* --- END OF NEW STYLES --- */
    </style>
</head>

<body>
    <div id="particles-js"></div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <img class="navbar-brand" src="{% static 'images/logo.png' %}" style="width: 7%; height: 7%;" href="#">
            <ul class="navbar-nav ms-auto flex-row align-items-center">
                <li class="nav-item me-3"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item me-3"><a class="nav-link" href="#projects">Projects</a></li>
                <li class="nav-item me-3"><a class="nav-link" href="#experience">Experience</a></li>
                <li class="nav-item me-3"><a class="nav-link" href="{% url 'blog_list' %}">Blog</a></li>
                <li class="nav-item me-3"><a class="nav-link" href="#contact">Contact</a></li>
                <li class="nav-item">
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch" for="checkbox">
                            <input type="checkbox" id="checkbox" />
                            <div class="slider round"></div>
                        </label>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4">
        <p class="text-secondary">&copy; {% now "Y" %} Tanbir Hasan. All Rights Reserved.</p>
    </footer>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
