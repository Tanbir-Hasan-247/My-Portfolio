{% extends 'portfolio/base.html' %}
{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="hero-title mb-3">{{ post.title }}</h1>
            <p class="text-secondary mb-4">Published on {{ post.published_date|date:"F j, Y" }}</p>
            {% if post.featured_image %}
                <img src="{{ post.featured_image.url }}" class="img-fluid rounded mb-4" alt="{{ post.title }}">
            {% endif %}
            <div class="fs-5 blog-post-content">
                {{ post.content|linebreaks }}
            </div>
            <a href="{% url 'blog_list' %}" class="btn btn-secondary-custom mt-5">← Back to Blog</a>
        </div>
    </div>
</div>
{% endblock %}
