{% extends 'portfolio/base.html' %}
{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="blog-post-header text-center mb-5">
                <p class="post-meta">{{ post.published_date|date:"F j, Y" }}</p>
                <h1 class="hero-title">{{ post.title }}</h1>
            </div>

            {% if post.featured_image %}
            <img src="{{ post.featured_image.url }}" alt="{{ post.title }}" class="img-fluid rounded mb-5 blog-detail-image">
            {% endif %}

            <div class="blog-detail-content">
                {{ post.content|linebreaks }}
            </div>

            <hr class="my-5">

            <div class="text-center">
                <a href="{% url 'blog_list' %}" class="btn btn-secondary-custom">← Back to All Articles</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
